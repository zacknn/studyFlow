[project]
name = "ai-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zaknx7", email = "zakitalhi13@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-ai>=2.63.0",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
